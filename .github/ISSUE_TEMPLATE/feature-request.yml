name: Feature request
description: A concrete idea that would make reviewing easier.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gets in your way while reviewing today? Describe the situation, not only the button you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it would work. A sketch or a screenshot of something similar helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead now
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I can help test this if it gets built.
