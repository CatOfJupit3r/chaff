name:
  chaff
services:
  postgres:
    image: postgres:17-alpine
    container_name: chaff-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=chaff
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaff"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
